<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="คุมงานก่อสร้าง">
<meta name="theme-color" content="#1B4F9C">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="คุมงาน">
<meta name="robots" content="noindex, nofollow">
<title>คุมงานก่อสร้าง</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#1B4F9C;--pri2:#2E6BC6;--acc:#F2A93B;--ink:#1c2433;--soft:#5d6778;--line:#dde3ec;--bg:#f2f5f9;--card:#fff;--chip:#eef2f8;
--ok:#1f7a45;--ok-bg:#e2f3e9;--warn:#935b00;--warn-bg:#fff1cf;--bad:#b3261e;--bad-bg:#fde3e1;--na:#667085;--na-bg:#eef1f5;--r:14px;--nav:64px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--ink:#e6eaf2;--soft:#9aa6ba;--line:#2c3547;--bg:#0f141c;--card:#171e2a;--chip:#1f2837;--pri2:#6ea2ff;
--ok:#6fd49a;--ok-bg:#153324;--warn:#ffc864;--warn-bg:#3a2c0f;--bad:#ff8a80;--bad-bg:#3d1714;--na:#9aa6ba;--na-bg:#222b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e6eaf2;--soft:#9aa6ba;--line:#2c3547;--bg:#0f141c;--card:#171e2a;--chip:#1f2837;--pri2:#6ea2ff;
--ok:#6fd49a;--ok-bg:#153324;--warn:#ffc864;--warn-bg:#3a2c0f;--bad:#ff8a80;--bad-bg:#3d1714;--na:#9aa6ba;--na-bg:#222b3a}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Sarabun',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.hidden{display:none!important}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:#fff;padding:6px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;padding:calc(8px + var(--safe-t)) 12px 8px;display:flex;align-items:center;gap:8px;min-height:52px}
.top .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0;flex:1;cursor:pointer}
.top .brand img{width:28px;height:28px;border-radius:7px}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{display:block;font-weight:400;opacity:.8;font-size:12px}
.tbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.26)}
/* layout */
.shell{display:flex;min-height:calc(100% - 52px)}
nav.side{display:none}
main{flex:1;min-width:0;max-width:1120px;margin:0 auto;padding:14px 14px calc(var(--nav) + 24px + var(--safe-b))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.bottom button,nav.side button{flex:1;border:0;background:none;padding:7px 2px 6px;cursor:pointer;color:var(--soft);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button b,nav.side button b{font-size:20px;line-height:1.2;font-weight:400}
nav.bottom button.on,nav.side button.on{color:var(--pri2);font-weight:700}
@media(min-width:900px){
  nav.bottom{display:none} main{padding-bottom:30px}
  nav.side{display:flex;flex-direction:column;gap:4px;width:200px;flex:0 0 200px;padding:14px 10px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:52px;height:calc(100vh - 52px)}
  nav.side button{flex:0;flex-direction:row;gap:10px;font-size:15px;padding:10px 12px;border-radius:10px;justify-content:flex-start}
  nav.side button.on{background:var(--chip)}
  nav.side .sep{border-top:1px solid var(--line);margin:8px 0}
}
/* cards & components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card>h2,.h2{font-size:17px;margin:0 0 10px;color:var(--pri2);font-weight:700}
.h3{font-size:15px;margin:14px 0 6px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--soft)}.kpi .v{font-size:22px;font-weight:700}.kpi .s{font-size:12px;color:var(--soft)}
.ok-t{color:var(--ok)!important}.bad-t{color:var(--bad)!important}.warn-t{color:var(--warn)!important}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-na{background:var(--na-bg);color:var(--na)}
.btn{border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;background:var(--pri);color:#fff;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}.btn.sec{background:var(--chip);color:var(--ink)}.btn.ok{background:#1f7a45}.btn.bad{background:#b3261e}.btn.acc{background:#c77a06}
.btn.sm{padding:6px 11px;font-size:13px}.btn.ghost{background:none;color:var(--pri2);padding:6px 8px}
label.f{display:block;font-size:13px;color:var(--soft);margin:10px 0 3px}
.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card)}
.i:focus{outline:2px solid var(--pri2);outline-offset:-1px}
textarea.i{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--soft);font-weight:600}
.num{text-align:right;white-space:nowrap}.tw{overflow-x:auto}
@media(max-width:640px){.hide-m{display:none}}
.muted{color:var(--soft);font-size:13px}.empty{color:var(--soft);text-align:center;padding:26px 10px}
.bar{height:8px;background:var(--chip);border-radius:6px;position:relative;overflow:visible;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--pri2)}
.bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--acc)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.item .t{font-weight:600}.item .m{font-size:12px;color:var(--soft)}
.pgroup>summary{cursor:pointer;list-style:none;padding:8px 2px;font-weight:700;display:flex;gap:8px;align-items:center}
.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary:before{content:'▸';transition:transform .15s}.pgroup[open]>summary:before{transform:rotate(90deg)}
.pcard{cursor:pointer}.pcard:hover{border-color:var(--pri2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chartbox{position:relative;height:290px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.fthumb{aspect-ratio:4/3;background:var(--chip) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.fcap{border:0;border-top:1px solid var(--line);padding:6px 8px;font-size:12px;width:100%;background:var(--card)}
.fdel{border:0;background:none;color:var(--bad);cursor:pointer;float:right;padding:0 6px;font-size:13px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--soft);cursor:pointer;margin-bottom:10px}
.drop:hover{border-color:var(--pri2);color:var(--pri2)}
.lrow{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;margin-bottom:6px;align-items:center}
.xbtn{border:0;background:var(--chip);border-radius:8px;height:36px;cursor:pointer;color:var(--bad)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.info{background:var(--chip)}
/* modal, toast, lightbox */
.mbg{position:fixed;inset:0;background:rgba(8,14,26,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 10px;overflow:auto}
.modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;padding:16px 16px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:920px}.modal h2{margin:0 0 6px;font-size:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + var(--safe-b));transform:translateX(-50%);background:#1c2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:#b3261e}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.v-ผ่าน{color:var(--ok);font-weight:700}.v-ไม่ผ่าน{color:var(--bad);font-weight:700}.v-ไม่พบข้อมูล{color:var(--warn);font-weight:700}.v-ไม่เกี่ยวข้อง{color:var(--na)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 10px;cursor:pointer;font-size:13px}.seg button.on{background:var(--pri);color:#fff}
/* printable documents */
.doc{background:#fff;color:#000;max-width:820px;margin:0 auto;padding:30px 36px;border:1px solid var(--line);font-size:15px}
.doc h1{text-align:center;font-size:24px;margin:0 0 10px}
.doc .mh{display:grid;grid-template-columns:90px 1fr;gap:2px 8px;margin-bottom:8px}
.doc .para{text-indent:2.5em;text-align:justify;margin:6px 0}
.doc h3{font-size:15px;margin:14px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
.doc table th{background:#eef1f6;color:#000}.doc td,.doc th{border:1px solid #bbb;padding:5px 6px}
.doc .box{border:1px solid #bbb;padding:8px;min-height:36px;white-space:pre-wrap}
.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:26px;font-size:14px}
.doc .sig1{margin:26px 0 0 auto;width:300px;text-align:center}
.doc .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc figure{margin:0;border:1px solid #bbb;padding:6px;break-inside:avoid}
.doc figure img{width:100%;height:230px;object-fit:cover;display:block;background:#eee}
.doc figcaption{font-size:13px;margin-top:4px}
.doc .pb{break-before:page}
@media print{
  body{background:#fff}.top,nav,.noprint,.toast{display:none!important}
  main{padding:0!important;max-width:none}.doc{border:0;padding:0;max-width:none}
  @page{size:A4;margin:15mm 14mm}
}
</style>
</head>
<body>
<a class="skip" href="#main">ข้ามไปยังเนื้อหา</a>
<header class="top">
  <div class="brand" id="brand" title="หน้าหลัก"><img src="icons/icon-192.png" alt=""><span id="brandText">คุมงานก่อสร้าง<small>ทุกโครงการ</small></span></div>
  <button class="tbtn hidden" id="installBtn">⬇ ติดตั้ง</button>
  <button class="tbtn" id="menuBtn" aria-label="เมนู">☰</button>
</header>
<div class="shell">
  <nav class="side" id="sideNav" aria-label="เมนูหลัก"></nav>
  <main id="main" tabindex="-1"><div class="empty"><span class="spin"></span> กำลังโหลด…</div></main>
</div>
<nav class="bottom" id="bottomNav" aria-label="เมนูหลัก"></nav>
<script>
  // ธีม: ตั้งก่อนวาดหน้าเพื่อไม่ให้กระพริบ
  try { var th = localStorage.getItem('sc_theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<script src="vendor/chart.umd.min.js" defer></script>
<script src="spec-data.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
